# NEMT Simulator - Configuration
# Development Environment

app:
  name: "NEMT Simulator"
  version: "1.0.0"
  environment: "development"

server:
  host: "localhost"
  http_port: 8080
  grpc_port: 9090

python:
  grpc_port: 50051
  command: "python"
  args: ["-m", "nemt.core.main"]

gateway:
  url: "http://localhost:8080"
  health_check_interval: 30

market:
  data_provider: "binance"
  default_symbols:
    - "BTCUSDT"
    - "ETHUSDT"
  default_interval: "1h"

logging:
  level: "debug"
  file: "logs/nemt.log"
  max_size: 10485760  # 10MB
  max_backups: 5

ui:
  theme: "dark"
  language: "zh-CN"
  auto_save: true
  auto_save_interval: 300  # 5 minutes
