# NEMT 默认配置文件

# ==================== 仓位管理配置 ====================
position_management:
  # 默认算法模式: simple (简单动态百分比) / hybrid (ATR+凯利+信心度)
  default_mode: "simple"

  # 风险等级配置
  risk_tiers:
    micro:           # < 1万
      max_equity: 10000
      risk_per_trade: 0.05      # 每笔风险 5%
      max_position_pct: 0.25    # 最大仓位 25%
      max_daily_loss: 0.10      # 最大日亏损 10%
      max_drawdown: 0.20        # 最大回撤 20%
      label: "微型"

    small:           # 1-10万
      max_equity: 100000
      risk_per_trade: 0.03      # 每笔风险 3%
      max_position_pct: 0.20    # 最大仓位 20%
      max_daily_loss: 0.08      # 最大日亏损 8%
      max_drawdown: 0.15        # 最大回撤 15%
      label: "小型"

    medium:          # 10-100万
      max_equity: 1000000
      risk_per_trade: 0.02      # 每笔风险 2%
      max_position_pct: 0.15    # 最大仓位 15%
      max_daily_loss: 0.05      # 最大日亏损 5%
      max_drawdown: 0.10        # 最大回撤 10%
      label: "中型"

    large:           # > 100万
      max_equity: 999999999999
      risk_per_trade: 0.01      # 每笔风险 1%
      max_position_pct: 0.10    # 最大仓位 10%
      max_daily_loss: 0.03      # 最大日亏损 3%
      max_drawdown: 0.05        # 最大回撤 5%
      label: "大型"

  # 复合算法权重 (hybrid 模式)
  algorithm_weights:
    atr: 0.40        # ATR 波动率权重
    kelly: 0.30      # 凯利公式权重
    confidence: 0.30  # 信心度权重

  # 凯利公式配置
  kelly:
    multiplier: 0.5  # 保守系数 (半凯利)
    max_fraction: 0.25 # 最大仓位比例

  # ATR 配置
  atr:
    period: 14       # ATR 周期
    stop_multiplier: 2.0  # 止损 ATR 倍数

  # UI 配置
  ui:
    default_risk_level: "small"
    show_advanced_panel: true
    history_limit: 50

# ==================== 风险配置 ====================
risk:
  max_drawdown: 0.2        # 最大回撤 20%
  stop_loss: 0.05           # 止损 5%
  daily_loss_limit: 0.1      # 日内亏损限制 10%
  max_position_size: 0.2    # 最大仓位 20%
  max_leverage: 3.0         # 最大杠杆 3x

# ==================== 信号配置 ====================
signal:
  dci.period: 14            # DCI 周期
  vortex.period: 14         # Vortex 周期
  resonance.period: 20       # 共振周期
  confidence_threshold: 0.6   # 置信度阈值

# ==================== 执行配置 ====================
execution:
  min_order_size: 0.001     # 最小订单大小
  max_order_size: 1.0       # 最大订单大小
  base_size: 0.1             # 基础订单大小
  commission_rate: 0.001     # 手续费率 0.1%
  slippage: 0.0005          # 滑点 0.05%

# ==================== 策略配置 ====================
brain:
  strategies:
    - trend               # 趋势策略
    - mean_reversion     # 均值回归
  high_vol_threshold: 0.3  # 高波动阈值
  low_vol_threshold: 0.1   # 低波动阈值

# ==================== 市场配置 ====================
market:
  symbols:
    - BTC
  timeframe: 1h            # 时间周期
  data_source: mock         # 数据源: mock, binance, csv

# ==================== COS 配置 ====================
cos:
  enabled: false            # 是否启用 COS 数据源
  secret_id: ""            # COS Secret ID
  secret_key: ""           # COS Secret Key
  bucket: "nemt-market-data"  # COS Bucket 名称
  region: "ap-guangzhou"    # COS 区域
  cache_ttl: "5m"          # 缓存 TTL

# ==================== 进化配置 ====================
evolution:
  enabled: false           # 是否启用策略进化
  population_size: 10       # 种群大小
  mutation_rate: 0.1       # 变异率
  crossover_rate: 0.7      # 交叉率
  elite_count: 2           # 精英数量
  max_generations: 100     # 最大代数
