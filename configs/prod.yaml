# NEMT Simulator - Configuration
# Production Environment

app:
  name: "NEMT Simulator"
  version: "1.0.0"
  environment: "production"

server:
  host: "0.0.0.0"
  http_port: 8080
  grpc_port: 9090

python:
  grpc_port: 50051
  command: "python"
  args: ["-m", "nemt.core.main"]

gateway:
  url: "http://localhost:8080"
  health_check_interval: 60

market:
  data_provider: "binance"
  default_symbols:
    - "BTCUSDT"
    - "ETHUSDT"
  default_interval: "1h"

logging:
  level: "info"
  file: "logs/nemt.log"
  max_size: 52428800  # 50MB
  max_backups: 10

ui:
  theme: "dark"
  language: "zh-CN"
  auto_save: true
  auto_save_interval: 300
