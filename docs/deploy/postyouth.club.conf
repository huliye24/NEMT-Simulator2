# NEMT Trade public application entry.
server {
    listen 80;
    listen [::]:80;
    server_name postyouth.club www.postyouth.club;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postyouth.club www.postyouth.club;

    ssl_certificate /etc/letsencrypt/live/postyouth.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postyouth.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NEMTSSL2:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /manifest.webmanifest { proxy_pass http://127.0.0.1:3101; proxy_set_header Host $host; }
    location = /sw.js { proxy_pass http://127.0.0.1:3101; proxy_set_header Host $host; }
    location = /offline.html { proxy_pass http://127.0.0.1:3101; proxy_set_header Host $host; }
    location ^~ /icons/ { proxy_pass http://127.0.0.1:3101; proxy_set_header Host $host; }

    location = /rivertype { return 302 /rivertype/; }
    location ^~ /rivertype/ {
        alias /var/www/rivertype/;
        try_files $uri $uri/ /rivertype/index.html;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = / { return 302 /trade; }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }
}
