name: NEMT App CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (DEMO, no secrets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/trade_requirements.txt
      - name: Install app API dependencies
        run: pip install -r trade_requirements.txt
      - name: Run tests (never uses LIVE or real credentials)
        run: python -m pytest
      - name: DEMO API health and readiness smoke
        env:
          NEMT_APP_MODE: DEMO
          NEMT_MARKET_SOURCE: demo
          NEMT_DATABASE_PATH: backend/.data/ci-smoke.sqlite3
          NEMT_SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
          NEMT_API_HOST: 127.0.0.1
          NEMT_API_PORT: "8000"
        run: |
          set -euo pipefail
          mkdir -p .data
          python trade_main.py &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health -o /tmp/nemt-health.json; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready -o /tmp/nemt-ready.json
          python - <<'PY'
          import json
          health = json.load(open("/tmp/nemt-health.json", encoding="utf-8"))
          ready = json.load(open("/tmp/nemt-ready.json", encoding="utf-8"))
          assert health["status"] == "ok", health
          assert health["mode"] == "DEMO", health
          assert ready["status"] == "ready", ready
          assert ready["database"] == "ok", ready
          print("DEMO health/readiness: ok")
          PY

  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  format:
    name: Python format check (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: pip install ruff==0.6.9
      - name: Check baseline Python formatting
        # Legacy backend modules outside the baseline are formatted in #14.
        run: >-
          ruff format --check
          backend/trade_app/config.py
          backend/trade_main.py
          backend/tests/test_baseline.py

  compose:
    name: Compose config and Redis loopback health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml \
            --profile quant --profile full --profile tools --profile web config -q
          docker compose -f quant-mvp/docker-compose.yml \
            --profile tools --profile backtest config -q
      - name: Redis loopback binding and health
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml --profile quant up -d --wait redis
          trap 'docker compose -f docker-compose.yml --profile quant down -v' EXIT
          test "$(docker inspect -f '{{.State.Health.Status}}' nemt-redis)" = healthy
          docker port nemt-redis 6379 | tee /tmp/nemt-redis-port.txt
          grep -q '^127.0.0.1:6379$' /tmp/nemt-redis-port.txt
          test "$(docker exec nemt-redis redis-cli ping)" = PONG

  secret-hygiene:
    name: New-source secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Known historical findings are documented in docs/SECURITY_CLEANUP_PLAN.md.
      # This guard only fails on private-key material or obvious non-empty
      # exchange/COS secrets inside the new app source.
      - name: Scan app source for committed secrets
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|COS_SECRET_KEY=[^[:space:]#]+|NEMT_BINANCE_API_(KEY|SECRET)=[^[:space:]#]+' \
              backend/trade_app backend/tests web/src; then
            echo "::error::Potential committed secret detected in app source"
            exit 1
          fi
          echo "No obvious secrets in app source."
      - name: Enforce baseline configuration defaults
        run: |
          set -euo pipefail
          grep -qx 'NEMT_APP_MODE=DEMO' backend/.env.example
          grep -qx 'NEMT_LIVE_TRADING_ENABLED=false' backend/.env.example
          if grep -Eq '^NEMT_BINANCE_API_(KEY|SECRET)=.+' backend/.env.example; then
            echo "::error::Exchange credentials in .env.example must stay empty"
            exit 1
          fi
          echo "DEMO default, LIVE disabled, exchange placeholders empty."
