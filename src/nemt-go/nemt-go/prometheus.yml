# Prometheus configuration for NEMT Gateway

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NEMT Gateway metrics
  - job_name: 'nemt-gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: /metrics

  # Redis metrics (if redis_exporter is running)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
