# golangci-lint configuration for NEMT-Go
# Run: golangci-lint run ./...

run:
  timeout: 5m
  tests: false
  modules-download-mode: readonly

linters:
  enable:
    - errcheck        # Check for unchecked errors
    - gosimple        # Simplify code
    - govet           # Reports suspicious constructs
    - ineffassign     # Detects unused variable assignments
    - staticcheck     # Static analysis checks
    - unused          # Checks for unused code
    - gosec           # Security issues
    - prealloc        # Find slice declarations that could be preallocated
    - exportloopref  # Checks for pointers to enclosing loop variables
    - makezero       # Finds slice declarations that could be preallocated with make(nil)
    - unconvert       # Detects unnecessary type conversions
    - unparam         # Reports unused function parameters
    - gocritic        # Provides diagnostics that check for bugs and style issues

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true

  gocyclo:
    min-complexity: 15

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

  goimports:
    local-prefixes: github.com/nemt-lab/nemt-go

  gci:
    run: true
    sections:
      - Standard
      - Default
      - Prefix(github.com/nemt-lab/nemt-go)

  misspell:
    locale: US

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-patterns:
    - ".*_test.go"
    - ".*_mock.go"
