# ExecutionNode Schema

name: execution_node
version: 1.0.0
description: Order execution node for sending orders to exchange

inputs:
  - name: decision
    type: object
    required: true
    description: Trading decision from brain_node
    properties:
      decision_id:
        type: string
      action:
        type: string
        enum: ["EXECUTE", "SKIP", "WAIT"]
      symbol:
        type: string
      direction:
        type: string
      size:
        type: number
      entry_price:
        type: number
      stop_loss:
        type: number
      take_profit:
        type: number
    required_fields:
      - decision_id
      - action
      - symbol

outputs:
  - name: order
    type: object
    required: false
    description: Order to send to exchange
    properties:
      order_id:
        type: string
      symbol:
        type: string
      direction:
        type: string
      order_type:
        type: string
        enum: ["MARKET", "LIMIT", "STOP"]
      size:
        type: number
      price:
        type: number
      stop_loss:
        type: number
      take_profit:
        type: number
      status:
        type: string
        enum: ["PENDING", "FILLED", "PARTIAL", "CANCELLED", "REJECTED"]
      timestamp:
        type: integer
    required_fields:
      - order_id
      - symbol
      - direction
      - size

  - name: fill
    type: object
    required: false
    description: Order fill event
    properties:
      order_id:
        type: string
      fill_id:
        type: string
      symbol:
        type: string
      size:
        type: number
      fill_price:
        type: number
      fees:
        type: number
      timestamp:
        type: integer

  - name: portfolio
    type: object
    required: true
    description: Current portfolio state
    properties:
      total_value:
        type: number
      available_balance:
        type: number
      positions:
        type: array
      daily_pnl:
        type: number
      drawdown:
        type: number

constraints:
  - name: initial_balance
    type: immutable
    value: 100000
    description: Initial account balance

  - name: min_order_size
    type: runtime
    value: 10
    description: Minimum order size
    min: 0

  - name: max_orders_per_minute
    type: runtime
    value: 10
    description: Rate limit for orders
    min: 1
    max: 60

  - name: order_fee_rate
    type: immutable
    value: 0.001
    description: Trading fee rate (0.1%)
    min: 0
    max: 1

  - name: slippage_rate
    type: runtime
    value: 0.0005
    description: Expected slippage rate (0.05%)
