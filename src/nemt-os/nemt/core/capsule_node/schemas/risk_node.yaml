# RiskNode Schema

name: risk_node
version: 1.0.0
description: Risk management node for evaluating trading signals

inputs:
  - name: signal
    type: object
    required: true
    description: Trading signal to evaluate
    properties:
      signal_id:
        type: string
      symbol:
        type: string
      direction:
        type: string
        enum: ["LONG", "SHORT", "NEUTRAL"]
      confidence:
        type: number
      entry_price:
        type: number
      stop_loss:
        type: number
      take_profit:
        type: number
    required_fields:
      - signal_id
      - symbol
      - direction

  - name: portfolio
    type: object
    required: true
    description: Current portfolio state
    properties:
      total_value:
        type: number
      available_balance:
        type: number
      positions:
        type: array
      daily_pnl:
        type: number
      drawdown:
        type: number
    required_fields:
      - total_value
      - available_balance

outputs:
  - name: risk_approved_signal
    type: object
    required: false
    description: Risk-approved signal (if passed all checks)
    properties:
      signal_id:
        type: string
      symbol:
        type: string
      direction:
        type: string
      approved_size:
        type: number
      risk_score:
        type: number
      timestamp:
        type: integer
    required_fields:
      - signal_id
      - symbol
      - direction
      - approved_size

  - name: risk_rejection
    type: object
    required: false
    description: Rejection reason (if failed any check)
    properties:
      signal_id:
        type: string
      reason:
        type: string
      rejected_at:
        type: integer
    required_fields:
      - signal_id
      - reason

  - name: risk_metrics
    type: object
    required: true
    description: Current risk metrics
    properties:
      portfolio_risk:
        type: number
      max_drawdown:
        type: number
      daily_loss_limit:
        type: number
      exposure_limit:
        type: number
      risk_score:
        type: number

constraints:
  - name: max_portfolio_risk
    type: immutable
    value: 0.1
    description: Maximum portfolio risk (10%)
    min: 0
    max: 1

  - name: max_drawdown
    type: immutable
    value: 0.15
    description: Maximum drawdown (15%)
    min: 0
    max: 1

  - name: daily_loss_limit
    type: runtime
    value: 0.03
    description: Daily loss limit (3%)
    min: 0
    max: 1

  - name: max_exposure_per_symbol
    type: immutable
    value: 0.2
    description: Max exposure per symbol (20%)
    min: 0
    max: 1

  - name: max_position_size
    type: runtime
    value: 0.1
    description: Maximum position size (10%)
    min: 0
    max: 1

  - name: min_confidence
    type: validation
    value: 0.5
    description: Minimum signal confidence
    min: 0
    max: 1
