# BrainNode Schema

name: brain_node
version: 1.0.0
description: Decision brain node for making final trading decisions

inputs:
  - name: signal
    type: object
    required: true
    description: Signal from signal_node
    properties:
      signal_id:
        type: string
      symbol:
        type: string
      direction:
        type: string
      confidence:
        type: number
    required_fields:
      - signal_id
      - symbol
      - direction

  - name: risk_evaluation
    type: object
    required: true
    description: Risk evaluation result
    properties:
      approved:
        type: boolean
      approved_size:
        type: number
      risk_score:
        type: number
    required_fields:
      - approved

  - name: market_phase
    type: string
    required: false
    description: Current market phase
    enum:
      - UNKNOWN
      - TREND_UP
      - TREND_DOWN
      - RANGE
      - VOLATILE

outputs:
  - name: decision
    type: object
    required: true
    description: Final trading decision
    properties:
      decision_id:
        type: string
      action:
        type: string
        enum: ["EXECUTE", "SKIP", "WAIT"]
      symbol:
        type: string
      direction:
        type: string
      size:
        type: number
      reason:
        type: string
      timestamp:
        type: integer
    required_fields:
      - decision_id
      - action
      - symbol

  - name: strategy_state
    type: object
    required: true
    description: Current strategy state
    properties:
      total_decisions:
        type: integer
      executions:
        type: integer
      skips:
        type: integer
      success_rate:
        type: number

constraints:
  - name: min_confidence_threshold
    type: validation
    value: 0.65
    description: Minimum combined confidence
    min: 0
    max: 1

  - name: max_risk_score
    type: validation
    value: 0.5
    description: Maximum risk score to proceed
    min: 0
    max: 1

  - name: consecutive_skips_limit
    type: runtime
    value: 5
    description: Max consecutive skips before forcing trade
    min: 1
    max: 20

  - name: decision_cooldown_ms
    type: runtime
    value: 1000
    description: Minimum time between decisions for same symbol
    min: 100
    max: 60000
